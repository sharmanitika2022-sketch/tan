<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gifts</title>
        <script src="music.js"></script>
    </body>

</html>

    <link rel="stylesheet" href="style.css">
    <style>
        /* Cute Cut-Out Sticker Styling for your Cat Picture */
        .cat-sticker-wrapper {
            display: inline-block;
            background: white;
            padding: 14px;
            border-radius: 30px;
            border: 4px solid #FFD1DC;
            /* Double shadow creates a real die-cut sticker effect! */
            box-shadow: 
                0 0 0 6px #FFFDF9,
                0 12px 28px rgba(255, 105, 180, 0.35);
            transform: rotate(-2deg);
            transition: transform 0.3s ease;
            margin: 10px auto 20px auto;
            animation: float 3s infinite ease-in-out;
        }

        .cat-sticker-wrapper:hover {
            transform: rotate(2deg) scale(1.05);
        }

        .cat-sticker-img {
            width: 230px;
            height: 230px;
            object-fit: contain;
            border-radius: 20px;
            display: block;
            background-color: #FFF5F7;
        }

        /* Modal for Try Again */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 182, 193, 0.55);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #FFFDF9;
            padding: 30px;
            border-radius: 25px;
            border: 5px solid #FF69B4;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 12px 30px rgba(255, 105, 180, 0.35);
            animation: bounceIn 0.5s;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Want to open your gifts???</h1>
        <p><br>I have packed some love inside, for my Pineapple!!!</p>
        
        <!-- Cute Cat Sticker Stage -->
        <div class="cat-stage">
            <div class="speech-bubble">
                Want to open your gifts? 🐾🎀
            </div>

            <!-- Sticker Frame for your Cat Picture -->
            <div class="cat-sticker-wrapper">
                <!-- Save your cat image as 'cat-sticker.png' (or .jpg) in your folder! -->
                <img src="cat-sticker.jpg" alt="Cute Cat Sticker Asking Want to open your gifts?" class="cat-sticker-img" onerror="this.style.display='none'; document.getElementById('catFallback').style.display='flex';">
                
                <!-- Fallback placeholder if 'cat-sticker.png' isn't added yet -->
                <div id="catFallback" style="display: none; width: 330px; height: 330px; flex-direction: column; justify-content: center; align-items: center; background: #FFF5F7; border: 2px dashed #FF69B4; border-radius: 20px; padding: 15px;">
                    <div style="font-size: 4.5rem; line-height: 1.1;">🐱🎁</div>
                    <p style="font-size: 0.85rem; color: #FF69B4; font-weight: bold; margin-top: 10px; margin-bottom: 0;">
                        Save your cat pic as<br><code>cat-sticker.png</code><br>in this folder! ✨
                    </p>
                </div>
            </div>
        </div>

        <div>
            <a href="gifts.html" class="btn">YES, OPEN THEM! 😍💖</a>
            <button onclick="showRetry()" class="btn btn-secondary">NO 😢</button>
        </div>
    </div>

    <!-- The Try Again Modal when clicking NO -->
    <div id="retryModal" class="modal">
        <div class="modal-content">
            <div style="font-size: 4rem; margin-bottom: 10px;">🙀💢</div>
            <h2 style="font-size: 1.6rem;">Oops, Please Try Again! 🥺</h2>
            <p>You can't say no to opening your birthday gifts ! Click Okay and press YES!</p>
            <button onclick="closeRetry()" class="btn">OKAY! 💖</button>
        </div>
    </div>

    <script>
        function showRetry() {
            document.getElementById('retryModal').style.display = 'flex';
        }
        function closeRetry() {
            document.getElementById('retryModal').style.display = 'none';
        }
    </script>
</body>
</html>
